name: Propose use case
description: Paste a link (X, GitHub, article) or a short note. Novel leaves auto-merge to the map.
title: "[propose] "
labels: ["propose"]
body:
  - type: markdown
    attributes:
      value: |
        **Link-first.** Paste an X post, repo, or article. Optional note if the link needs context.
        Novel proposals are graded by Jev and auto-merged onto the map.
  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: X / Twitter, GitHub, blog, demo — we’ll fetch the content.
      placeholder: https://x.com/… or https://github.com/… or https://…
  - type: textarea
    id: description
    attributes:
      label: Note (optional)
      description: Only if the link isn’t enough — or paste a use case with no link.
      placeholder: Optional context…
  - type: dropdown
    id: suggested_pillar
    attributes:
      label: Suggested pillar
      description: Optional hint — Jev still chooses.
      options:
        - (let Jev decide)
        - workflow
        - bulk
        - realtime
        - verify
        - harness
        - voice
